<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT MEMENTO // DEEP KERNEL v12.0</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-dark: #020408;
      --panel-bg: rgba(6, 11, 21, 0.92);
      --border-cyan: #00f0ff;
      --border-dim: rgba(0, 240, 255, 0.2);
      --accent-green: #00ff66;
      --accent-red: #ff0055;
      --text-main: #e0f2fe;
      --glow-cyan: rgba(0, 240, 255, 0.4);
      --glow-green: rgba(0, 255, 102, 0.5);
      --glow-red: rgba(255, 0, 85, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Fira Code', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    #bg-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%),
                  linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03));
      background-size: 100% 3px, 6px 100%;
      z-index: 10;
      pointer-events: none;
      opacity: 0.8;
    }

    .main-wrapper {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 850px;
    }

    .terminal-window {
      background: var(--panel-bg);
      border: 1px solid var(--border-cyan);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      cursor: pointer;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 15px;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--border-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 12px var(--glow-cyan);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: var(--border-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--border-cyan);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .metrics-group {
      display: flex;
      gap: 15px;
      font-size: 0.8rem;
    }

    .metric-badge {
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--border-dim);
      padding: 4px 10px;
      border-radius: 4px;
      color: var(--border-cyan);
    }

    .stability-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }

    .stability-track {
      flex-grow: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid var(--border-dim);
    }

    .stability-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent-red), var(--border-cyan), var(--accent-green));
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px var(--border-cyan);
    }

    .narrative-box {
      font-size: 0.95rem;
      line-height: 1.8;
      min-height: 160px;
      position: relative;
    }

    .cursor-blink {
      display: inline-block;
      width: 8px;
      height: 18px;
      background-color: var(--border-cyan);
      margin-left: 5px;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .choices-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hud-btn {
      background: rgba(10, 18, 32, 0.6);
      border: 1px solid var(--border-dim);
      color: var(--text-main);
      padding: 16px 20px;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 0.88rem;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 15px;
      position: relative;
      overflow: hidden;
    }

    .hud-btn::before {
      content: "❯";
      font-weight: bold;
      color: var(--border-cyan);
      opacity: 0.4;
      transition: all 0.2s;
      margin-top: 2px;

    .hud-btn:hover {
      transform: translateX(6px);

    .intent-neutral:hover {
      border-color: var(--border-cyan);
      box-shadow: 0 0 20px var(--glow-cyan);
      background: rgba(0, 240, 255, 0.08);
    }

    .intent-good:hover {
      border-color: var(--accent-green);
      box-shadow: 0 0 20px var(--glow-green);
      background: rgba(0, 255, 102, 0.08);
    }
    .intent-good::before { color: var(--accent-green); }

    .intent-bad:hover {
      border-color: var(--accent-red);
      box-shadow: 0 0 20px var(--glow-red);
      background: rgba(255, 0, 85, 0.08);
    }
    .intent-bad::before { color: var(--accent-red); }

    .hud-btn.active-good {
      background: var(--accent-green) !important;
      color: #000 !important;
      font-weight: bold;
      box-shadow: 0 0 30px var(--accent-green) !important;
    }
    .hud-btn.active-good::before { color: #000; }

    .hud-btn.active-bad {
      background: var(--accent-red) !important;

      font-weight: bold;
      box-shadow: 0 0 30px var(--accent-red) !important;
    }

    .restart-btn {

      border-color: var(--accent-green) !important;
      color: var(--accent-green) !important;

      font-size: 1.1rem;
      margin-bottom: 10px;
      display: block;
      text-shadow: 0 0 15px var(--glow-red);

  </style>
</head>

    class AudioEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playBeep() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(750 + Math.random() * 250, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.012, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.03);
      }
      playClick(isGood) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = isGood ? 'triangle' : 'sawtooth';
        osc.frequency.setValueAtTime(isGood ? 520 : 160, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(isGood ? 880 : 70, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
    }

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedY = (Math.random() - 0.5) * 0.4;
        this.opacity = Math.random() * 0.4 + 0.1;
      }
      update() {
        this.y += this.speedY;
        if (this.y < 0 || this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(0, 240, 255, ${this.opacity})`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    for (let i = 0; i < 60; i++) particles.push(new Particle());

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }

      let i = 0;
      let isTag = false;
      let buffer = "";

      function step() {
        if (i < htmlText.length) {
          let char = htmlText.charAt(i);
          if (char === '<') isTag = true;
          buffer += char;
          if (char === '>') isTag = false;

          textTarget.innerHTML = buffer;
          i++;

          if (isTag) {
            step();
          } else {
            if (Math.random() > 0.6) audio.playBeep();
            typeTimeout = setTimeout(step, 12);
          }
        } else {
          finishTyping();
        }
      }
      step();
    }

    function finishTyping() {
      clearTimeout(typeTimeout);
      textTarget.innerHTML = fullTextBuffer;
      isTyping = false;
      cursor.style.display = 'none';
      if (typingCallback) {
        typingCallback();
        typingCallback = null;
      }
    }

    terminalWin.addEventListener('click', (e) => {
      audio.init();
      if (e.target.tagName === 'BUTTON') return;
      if (isTyping) finishTyping();
    });

    function initGame() {
      currentSubject = subjects[Math.floor(Math.random() * subjects.length)];
      subjectIdElem.innerText = `ID: ${currentSubject}`;
      cycleCountElem.innerText = `CICLO: #${String(currentCycle).padStart(2, '0')}`;
      stability = 100;
      updateStability(0);
      currentStoryData = getStoryData(currentSubject);
      renderScene('start');
    }

    function renderScene(key) {
      if (key === 'restart') {
        currentCycle++;
        initGame();
        return;
      }

      const scene = currentStoryData[key];
      choicesContainer.innerHTML = '';

      typeWriter(scene.text, () => {
        scene.choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.className = `hud-btn intent-${choice.intent || 'neutral'}` + (choice.isRestart ? ' restart-btn' : '');
          btn.innerHTML = choice.text;

          btn.onclick = (e) => {
            e.stopPropagation();
            audio.init();
            audio.playClick(choice.intent === 'good');

            if (choice.stabilityDelta) updateStability(choice.stabilityDelta);

            btn.classList.add(choice.intent === 'good' ? 'active-good' : 'active-bad');

            setTimeout(() => {
              renderScene(choice.target);
            }, 200);
          };

          choicesContainer.appendChild(btn);
        });
      });
    }

    initGame();
  </script>
</body>
